<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зерна — Сковорода: Сад думок</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Lora:ital@1&display=swap" rel="stylesheet">
</head>
<body class="page-zerna">
    <header id="main-header"></header>

    <main class="grains-container">
        <div class="grains-slider">
            <div class="grain-slide">
                <div class="century-toggle">
                    <button id="btn-17c" class="century-button active" data-century="17c">XVII Століття</button>
                    <button id="btn-20c" class="century-button" data-century="20c">XXI Століття</button>
                </div>
                <div class="grain-content">
                    <h2 id="grain-title" class="grain-title"></h2>
                    <p id="grain-description" class="grain-quote"></p>
                </div>
                <audio id="grain-audio" controls>
                    <source src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <div class="grain-controls">
                    <button id="prev-grain" class="grain-button">&larr; Попереднє</button>
                    <button id="next-grain" class="grain-button">Наступне &rarr;</button>
                </div>
            </div>
        </div>
    </main>

    <div id="main-footer"></div>
    <script src="js/main.js"></script>
    <script src="js/grains.js"></script>
</body>
</html>
