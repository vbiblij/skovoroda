<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-гра: Знайди пару байки Сковороди</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fable-game">
    <main>
        <section class="game-area">
            <h1 class="page-title">Знайди пару байки Сковороди</h1>

            <div class="scoreboard">
                <div class="score-card"><strong id="score-value">0</strong><span>Очки</span></div>
            </div>

            <div class="game-grid" id="game-grid"></div>
        </section>
    </main>

    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-box">
            <p id="modal-text"></p>
            <button class="modal-button" id="modal-close">Гаразд</button>
        </div>
    </div>

    <script src="js/fable-match.js"></script>
</body>
</html>
