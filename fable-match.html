<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-гра: Знайди пару байки Сковороди</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fable-game">
    <header id="main-header"></header>
    <main>
        <section class="reflection-container">
            <h1 class="page-title">Знайди пару байки Сковороди</h1>
            <p class="page-intro">Кожна пара комірок належить одній байці. Вибери одну картку, потім другу. Якщо це правильна пара — отримаєш очки й побачиш назву байки. Якщо ні — з'явиться повідомлення, що такої байки не існує.</p>

            <div class="game-status">
                <div class="scoreboard">
                    <div class="score-card"><strong id="score-value">0</strong><span>Очки</span></div>
                </div>
                <div class="game-message" id="game-message">Оберіть першу картку.</div>
            </div>

            <div class="game-grid" id="game-grid"></div>
        </section>
    </main>
    <div id="main-footer"></div>
    <script src="js/fable-match.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
